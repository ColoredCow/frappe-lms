name: Semantic Pull Request

# zeke/semantic-pull-requests@main no longer ships an action.yml, so the old job
# failed before it read the title. amannn/action-semantic-pull-request is the
# maintained equivalent, pinned to the v6.1.1 commit.
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
